# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java


trigger:
  branches:
    include:
      - master

pool:
  name: Default
  demands:
    - Agent.Name -equals MacBook-Appium-Agent

stages:
  - stage: AppiumAutomation
    displayName: 'Execute Appium Automation'

    jobs:
      - job: AppiumTests
        displayName: 'Run Tests on Mac Agent'

        steps:
          - checkout: self

          - task: CmdLine@2
            displayName: 'Verify Java, Maven and Appium'
            inputs:
              script: |
                echo "Checking Java"
                java -version

                echo "Checking Maven"
                mvn -version

                echo "Checking Appium"
                appium --version

                echo "Checking Android devices"
                adb devices

          - task: CmdLine@2
            displayName: 'Start Appium Server'
            inputs:
              script: |
                nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &

                for i in {1..30}; do
                  if curl -s http://127.0.0.1:4723/status > /dev/null; then
                    echo "Appium server started successfully"
                    exit 0
                  fi
                  sleep 2
                done

                echo "Appium server failed to start"
                cat appium.log
                exit 1

          - task: CmdLine@2
            displayName: 'Execute Appium TestNG Automation'
            inputs:
              script: |
                mvn clean test

          - task: PublishTestResults@2
            displayName: 'Publish TestNG Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              failTaskOnFailedTests: true
            condition: succeededOrFailed()
