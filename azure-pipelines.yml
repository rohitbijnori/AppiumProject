# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java




trigger:
  branches:
    include:
      - master

pool:
  name: Appium-Mac

stages:
  - stage: CrossPlatformAutomation
    displayName: 'Cross Platform Appium Testing'

    jobs:

      # ANDROID JOB
      - job: AndroidTests
        displayName: 'Android Automation Tests'

        steps:
          - checkout: self

          - task: CmdLine@2
            displayName: 'Verify Android Environment'
            inputs:
              script: |
                java -version
                mvn -version
                appium --version
                adb devices

          - task: CmdLine@2
            displayName: 'Run Android Tests'
            inputs:
              script: |
                nohup appium --address 127.0.0.1 --port 4723 > "$(Agent.TempDirectory)/appium-android.log" 2>&1 &
                APPIUM_PID=$!
                trap 'kill $APPIUM_PID 2>/dev/null || true' EXIT

                for i in {1..30}; do
                  if curl -s http://127.0.0.1:4723/status > /dev/null; then
                    echo "Android Appium server started"
                    break
                  fi
                  sleep 2
                done

                curl -sf http://127.0.0.1:4723/status > /dev/null || {
                  cat "$(Agent.TempDirectory)/appium-android.log"
                  exit 1
                }

                mvn clean test \
                  -Dplatform=Android \
                  -DappiumUrl=http://127.0.0.1:4723

          - task: PublishTestResults@2
            displayName: 'Publish Android Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'Android Test Results'
            condition: succeededOrFailed()

      # IOS JOB
      - job: IOSTests
        displayName: 'iOS Automation Tests'

        steps:
          - checkout: self

          - task: CmdLine@2
            displayName: 'Verify iOS Environment'
            inputs:
              script: |
                java -version
                mvn -version
                appium --version
                xcrun simctl list devices booted

          - task: CmdLine@2
            displayName: 'Run iOS Tests'
            inputs:
              script: |
                nohup appium --address 127.0.0.1 --port 4725 > "$(Agent.TempDirectory)/appium-ios.log" 2>&1 &
                APPIUM_PID=$!
                trap 'kill $APPIUM_PID 2>/dev/null || true' EXIT

                for i in {1..30}; do
                  if curl -s http://127.0.0.1:4725/status > /dev/null; then
                    echo "iOS Appium server started"
                    break
                  fi
                  sleep 2
                done

                curl -sf http://127.0.0.1:4725/status > /dev/null || {
                  cat "$(Agent.TempDirectory)/appium-ios.log"
                  exit 1
                }

                mvn clean test \
                  -Dplatform=iOS \
                  -DappiumUrl=http://127.0.0.1:4725

          - task: PublishTestResults@2
            displayName: 'Publish iOS Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'iOS Test Results'
            condition: succeededOrFailed()
