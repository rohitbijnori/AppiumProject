# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java



trigger:
  branches:
    include:
      - master

pool:
  name: Appium-Mac
  demands:
    - Agent.Name -equals MacBook-Appium-Agent

stages:
  - stage: AppiumAutomation
    displayName: 'Appium Automation Testing'

    jobs:
      - job: AppiumTests
        displayName: 'Run Tests on Mac Agent'

        steps:
          # Checkout source code
          - checkout: self

          # Step 1: Verify environment
          - task: CmdLine@2
            displayName: 'Verify Java, Maven and Appium'
            inputs:
              script: |
                echo "Checking Java version"
                java -version

                echo "Checking Maven version"
                mvn -version

                echo "Checking Appium version"
                appium --version

                echo "Checking Android devices"
                adb devices

          # Step 2: Start Appium server
          - task: CmdLine@2
            displayName: 'Start Appium Server'
            inputs:
              script: |
                nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &

                for i in {1..30}; do
                  if curl -s http://127.0.0.1:4723/status > /dev/null; then
                    echo "Appium server started successfully"
                    exit 0
                  fi

                  sleep 2
                done

                echo "Appium server failed to start"
                cat appium.log
                exit 1

          # Step 3: Execute Maven tests
          - task: CmdLine@2
            displayName: 'Run Appium Automation Tests'
            inputs:
              script: |
                mvn clean test

          # Step 4: Publish TestNG results
          - task: PublishTestResults@2
            displayName: 'Publish TestNG Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              failTaskOnFailedTests: true
              testRunTitle: 'Appium Automation Test Results'
            condition: succeededOrFailed()
